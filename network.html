<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Currency Network — Perfect Entry</title><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d10;--bg2:#0f1216;--bg3:#131720;--teal:#01a0b8;--teal-dark:#015662;--text:#EAFDFC;--text-dim:rgba(234,253,252,0.6);--text-mute:rgba(234,253,252,0.35);--border:rgba(255,255,255,0.08);--orange:#FF6A2A;--amber:#ffb700;--green:#00e6aa;--red:#FF9060;--hard-red:#FF6060;--mono:'IBM Plex Mono',monospace}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}a{text-decoration:none;color:inherit}
nav{position:sticky;top:0;z-index:200;background:rgba(11,13,16,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}.nav-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px}.nav-logo img{width:24px;height:24px;object-fit:contain}.nav-links{display:flex;gap:16px;font-size:12px;font-weight:600;margin-left:auto}.nav-links a{color:var(--text-dim);transition:color .15s}.nav-links a:hover,.nav-links a.active{color:var(--orange)}.nav-cta{padding:7px 16px;border-radius:10px;border:2px solid var(--teal-dark);background:rgba(1,86,98,.15);font-weight:800;font-size:12px;white-space:nowrap}.nav-cta:hover{background:rgba(1,86,98,.35)}@media(max-width:768px){.nav-links{display:none}}
.page{max-width:1400px;margin:0 auto;padding:32px 20px 64px}h1{font-size:clamp(24px,4vw,42px);font-weight:900;margin-bottom:8px}.subtitle{color:var(--text-dim);font-size:clamp(13px,1.5vw,16px);line-height:1.6;max-width:850px;margin-bottom:24px}.era-pill{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid rgba(1,160,184,.25);background:rgba(1,160,184,.08);border-radius:999px;color:var(--text-dim);font:600 11px var(--mono);margin-bottom:24px}.era-pill b{color:var(--teal)}
.hero-stats,.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:32px}.hero-stat,.compare-card,.card,.chart-card,.section-card{border:1px solid var(--border);border-radius:14px;background:var(--bg2);padding:18px 16px}.hero-stat{text-align:center}.label,.cc-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}.val,.s-val{font-size:clamp(19px,3vw,28px);font-weight:900;font-family:var(--mono)}.sub{font-size:10px;color:var(--text-mute);margin-top:4px}.val-green{color:var(--green)}.val-teal{color:var(--teal)}.val-amber{color:var(--amber)}.val-red{color:var(--red)}
.section{margin-bottom:40px}.section-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}.section-title span{font-size:11px;font-weight:600;color:var(--text-mute);font-family:var(--mono)}.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card h3,.section-card h3{font-size:13px;font-weight:700;color:var(--text-mute);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}.metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.metric-row:last-child{border:none}.metric-row .name{font-size:12px;color:var(--text-dim)}.metric-row .value{font-size:13px;font-weight:800;font-family:var(--mono)}.chart-wrap{position:relative;height:280px}
table{width:100%;border-collapse:collapse;font-size:12px}th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute);border-bottom:1px solid var(--border)}td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:12px}tr:hover td{background:rgba(255,255,255,.02)}.table-wrap{overflow-x:auto}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.06em;font-family:var(--mono)}.badge-g{background:rgba(0,230,170,.12);color:var(--green)}.badge-r{background:rgba(255,96,96,.12);color:var(--hard-red)}.badge-a{background:rgba(255,183,0,.12);color:var(--amber)}
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}.ccy-cell{border-radius:10px;padding:12px 8px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.03)}.ccy-name{font-size:13px;font-weight:900;margin-bottom:5px}.ccy-row{display:flex;justify-content:space-between;font:700 10px var(--mono);margin:3px 0}.small{font-size:10px;color:var(--text-mute)}.disclaimer{font-size:11px;color:var(--text-mute);line-height:1.7;border-top:1px solid var(--border);padding-top:20px;margin-top:40px}.loading{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@media(max-width:600px){.page{padding:20px 14px 48px}.chart-wrap{height:220px}}
html,body{height:100%;overflow:hidden}#canvas{position:fixed;inset:0;z-index:0;width:100%!important;height:100%!important}header{position:fixed;top:0;left:0;right:0;z-index:10;padding:16px 24px;display:flex;align-items:center;gap:12px;background:linear-gradient(to bottom,rgba(8,10,14,.95),transparent)}.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}.logo img{width:22px;height:22px}.logo span{font-weight:800;font-size:13px}.header-right{margin-left:auto;display:flex;gap:12px;align-items:center}.live-pill{display:flex;align-items:center;gap:6px;font:800 10px var(--mono);letter-spacing:.08em;color:var(--green);background:rgba(0,230,170,.08);border:1px solid rgba(0,230,170,.2);padding:4px 10px;border-radius:999px}.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}.back-btn{font-size:11px;font-weight:600;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);padding:5px 12px;border-radius:8px}.page-title{position:fixed;top:64px;left:24px;z-index:10;max-width:460px}.page-title h1{font-size:clamp(18px,2.5vw,30px);font-weight:900}.page-title p{font-size:11px;color:var(--text-dim);font-family:var(--mono);margin-top:4px;line-height:1.5}.legend{position:fixed;bottom:24px;left:24px;z-index:10;display:flex;flex-direction:column;gap:7px;background:rgba(13,16,23,.7);border:1px solid var(--border);border-radius:12px;padding:12px}.legend-title{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);margin-bottom:3px}.legend-item{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-dim)}.stats-bar{position:fixed;bottom:24px;right:24px;z-index:10;text-align:right;background:rgba(13,16,23,.7);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:180px}.s-label{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}.s-val{font-size:16px;font-weight:900;font-family:var(--mono)}.tooltip{position:fixed;z-index:20;background:rgba(13,16,23,.98);border:1px solid var(--border);border-radius:12px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity .15s;min-width:210px}.tt-sym{font-size:14px;font-weight:900;margin-bottom:8px}.tt-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;margin-bottom:4px}.tt-label{color:var(--text-mute)}.tt-val{font-family:var(--mono);font-weight:700}@media(max-width:768px){.legend,.stats-bar{display:none}}</style></head><body><canvas id="canvas"></canvas><header><a href="index.html" class="logo"><img src="assets/logo.png"><span>Perfect Entry</span></a><div class="header-right"><div class="live-pill"><span class="live-dot"></span>LIVE</div><a href="currencyai.html" class="back-btn">← Currency AI</a></div></header><div class="page-title"><h1>Currency Network</h1><p>Verified-era rolling currency win rates. Each node is split: left half = long WR, right half = short WR. Fill rises from bottom to top.</p></div><div class="legend"><div class="legend-title">Node halves</div><div class="legend-item"><span style="width:12px;height:12px;background:var(--green);display:inline-block;border-radius:3px"></span>≥50% WR</div><div class="legend-item"><span style="width:12px;height:12px;background:var(--amber);display:inline-block;border-radius:3px"></span>41.7–50%</div><div class="legend-item"><span style="width:12px;height:12px;background:var(--hard-red);display:inline-block;border-radius:3px"></span>&lt;41.7%</div><div class="legend-title" style="margin-top:8px">Signal</div><div class="legend-item">Top glow = long + short &gt; 100%</div><div class="legend-item">Node size = data volume</div></div><div class="stats-bar" id="statsBar"><div class="s-label">Loading</div><div class="s-val">—</div></div><div class="tooltip" id="tooltip"></div><script>
const SUPABASE_URL='https://nmfsqgqwjihpudiqnuwh.supabase.co', SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZnNxZ3F3amlocHVkaXFudXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDEwNjcsImV4cCI6MjA5NTcxNzA2N30.oPpvWBgLhI95342peeBnkpPsKeu6ZI0a9dA2iKMTR9I', HDR={apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON}, VERIFIED_START='2026-07-05T21:00:00Z'; const SPECIAL={XAUUSD:['XAU','USD'],XAGUSD:['XAG','USD'],BTCUSD:['BTC','USD'],ETHUSD:['ETH','USD'],NAS100:['NAS','USD']}; const CURRENCIES=['USD','EUR','GBP','JPY','AUD','NZD','CAD','CHF','XAU','XAG','BTC','ETH']; const PAIRS=['EURUSD','GBPUSD','AUDUSD','NZDUSD','USDCAD','USDCHF','USDJPY','EURGBP','EURAUD','EURCAD','EURNZD','EURJPY','GBPAUD','GBPCAD','GBPCHF','GBPNZD','GBPJPY','AUDJPY','AUDCAD','AUDCHF','AUDNZD','NZDJPY','NZDCAD','NZDCHF','CADJPY','CHFJPY','XAUUSD','XAGUSD','BTCUSD','ETHUSD']; const LOOKBACK=30, MIN=3;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;layout()}window.addEventListener('resize',resize);const nodes={},edges=[];CURRENCIES.forEach(c=>nodes[c]={id:c,x:0,y:0,r:26,longWR:null,shortWR:null,longTotal:0,shortTotal:0,trades:0});function getCcys(sym){const sp=SPECIAL[sym];return sp?sp:[sym.slice(0,3),sym.slice(3)]} PAIRS.forEach(sym=>{const [a,b]=getCcys(sym); if(nodes[a]&&nodes[b])edges.push({sym,a,b,trades:0})});function layout(){const list=Object.keys(nodes),rad=Math.min(W,H)*.32;list.forEach((c,i)=>{const a=i/list.length*Math.PI*2-Math.PI/2;nodes[c].x=W/2+Math.cos(a)*rad;nodes[c].y=H/2+Math.sin(a)*rad})}resize();function wrColor(w,a=1){if(w==null)return `rgba(255,255,255,${.12*a})`; if(w>=.5)return `rgba(0,230,170,${a})`; if(w>=.417)return `rgba(255,183,0,${a})`; return `rgba(255,96,96,${a})`} async function loadData(){const res=await fetch(SUPABASE_URL+'/rest/v1/signals?select=sym,dir,currency_ai_pass,r_result,shadow_r_result,created_at&created_at=gte.'+encodeURIComponent(VERIFIED_START)+'&or=(r_result.not.is.null,shadow_r_result.not.is.null)&order=created_at.asc&limit=5000',{headers:HDR}); if(!res.ok)return; const rows=(await res.json()).map(x=>{const r=Number.isFinite(Number(x.r_result))?Number(x.r_result):Number(x.shadow_r_result);return {...x,r,win:r>0}}).filter(x=>Number.isFinite(x.r)); const long={},short={},pairCount={};rows.forEach(row=>{const [base,quote]=getCcys(row.sym); if(!nodes[base]||!nodes[quote])return; pairCount[row.sym]=(pairCount[row.sym]||0)+1; [base,quote].forEach(c=>{long[c]||(long[c]=[]);short[c]||(short[c]=[])}); if(row.dir==='buy'){long[base].push(row.win);short[quote].push(row.win)}else{short[base].push(row.win);long[quote].push(row.win)}}); CURRENCIES.forEach(c=>{const l=(long[c]||[]).slice(-LOOKBACK),s=(short[c]||[]).slice(-LOOKBACK);nodes[c].longWR=l.length>=MIN?l.filter(Boolean).length/l.length:null;nodes[c].shortWR=s.length>=MIN?s.filter(Boolean).length/s.length:null;nodes[c].longTotal=l.length;nodes[c].shortTotal=s.length;nodes[c].trades=l.length+s.length}); edges.forEach(e=>e.trades=pairCount[e.sym]||0); const ai=rows.filter(r=>r.currency_ai_pass===true),w=ai.filter(r=>r.r>0).length,l=ai.length-w,pf=l?ai.filter(r=>r.r>0).reduce((a,b)=>a+b.r,0)/Math.abs(ai.filter(r=>r.r<=0).reduce((a,b)=>a+b.r,0)):0;document.getElementById('statsBar').innerHTML=`<div><div class="s-label">Verified-era outcomes</div><div class="s-val" style="color:var(--green)">${rows.length}</div></div><div style="margin-top:8px"><div class="s-label">CurrencyAI W/L</div><div class="s-val">${w}W / ${l}L</div></div><div style="margin-top:8px"><div class="s-label">PF</div><div class="s-val" style="color:var(--teal)">${Number.isFinite(pf)?pf.toFixed(3):'—'}</div></div>`};
function drawHalfGauge(n){const r=n.r,x=n.x,y=n.y;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='rgba(13,16,23,.92)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.stroke();[['longWR',-1],['shortWR',1]].forEach(([key,side])=>{const wr=n[key]; if(wr==null)return; ctx.save();ctx.beginPath(); if(side<0){ctx.rect(x-r,y-r,r,2*r)}else{ctx.rect(x,y-r,r,2*r)}ctx.clip(); const fillH=2*r*wr; const grad=ctx.createLinearGradient(x,y+r,x,y-r);grad.addColorStop(0,'rgba(255,96,96,.95)');grad.addColorStop(.417,'rgba(255,183,0,.9)');grad.addColorStop(.5,'rgba(0,230,170,.9)');grad.addColorStop(1,'rgba(0,230,170,.95)');ctx.fillStyle=grad;ctx.fillRect(x-r,y+r-fillH,2*r,fillH);ctx.restore()});ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.stroke(); const sum=(n.longWR!=null&&n.shortWR!=null)?n.longWR+n.shortWR:null; if(sum&&sum>1){const g=ctx.createRadialGradient(x,y-r,0,x,y-r,r*2.4);g.addColorStop(0,'rgba(0,230,170,.35)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-r,r*2.4,0,Math.PI*2);ctx.fill()} ctx.fillStyle='rgba(13,16,23,.65)';ctx.beginPath();ctx.arc(x,y,r*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#EAFDFC';ctx.font=`800 ${Math.max(10,r*.42)}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.id,x,y);ctx.font='700 9px IBM Plex Mono';ctx.fillStyle='rgba(234,253,252,.55)';const l=n.longWR!=null?(n.longWR*100).toFixed(0):'—',s=n.shortWR!=null?(n.shortWR*100).toFixed(0):'—';ctx.fillText(`${l}/${s}`,x,y+r+13);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.6);grad.addColorStop(0,'rgba(1,160,184,.04)');grad.addColorStop(1,'rgba(8,10,14,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);edges.forEach(e=>{const a=nodes[e.a],b=nodes[e.b];if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=e.trades?'rgba(1,160,184,.08)':'rgba(255,255,255,.025)';ctx.lineWidth=Math.max(.5,Math.min(3,e.trades/40));ctx.stroke()});Object.values(nodes).forEach(n=>{n.r=Math.max(20,Math.min(44,22+n.trades/3));drawHalfGauge(n)});requestAnimationFrame(draw)}
const tooltip=document.getElementById('tooltip');canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;let hit=null;Object.values(nodes).forEach(n=>{const dx=mx-n.x,dy=my-n.y;if(Math.hypot(dx,dy)<n.r+8)hit=n});if(hit){const fmt=w=>w==null?'Insufficient':(w*100).toFixed(1)+'%';const sum=(hit.longWR!=null&&hit.shortWR!=null)?((hit.longWR+hit.shortWR)*100).toFixed(1)+'%':'—';tooltip.innerHTML=`<div class="tt-sym">${hit.id}</div><div class="tt-row"><span class="tt-label">Long WR</span><span class="tt-val" style="color:${wrColor(hit.longWR)}">${fmt(hit.longWR)}</span></div><div class="tt-row"><span class="tt-label">Short WR</span><span class="tt-val" style="color:${wrColor(hit.shortWR)}">${fmt(hit.shortWR)}</span></div><div class="tt-row"><span class="tt-label">Asymmetry sum</span><span class="tt-val">${sum}</span></div><div class="tt-row"><span class="tt-label">Samples</span><span class="tt-val">${hit.longTotal}L · ${hit.shortTotal}S</span></div>`;tooltip.style.opacity=1;tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY+14)+'px'}else tooltip.style.opacity=0});loadData();setInterval(()=>{if(!document.hidden)loadData()},300000);draw();
</script></body></html>
