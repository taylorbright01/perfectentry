name: Perfect View checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:workers
      - run: python3 tests/history-import.test.py
      - run: npm audit --audit-level=high
      - run: npx wrangler deploy --dry-run --config cloudflare/collector/wrangler.jsonc
      - run: npx wrangler deploy --dry-run --config cloudflare/accounts/wrangler.jsonc
